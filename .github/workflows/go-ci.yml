name: Go Quality Check & CI

on:
  pull_request:
    branches: [ "main" ] # รัน CI เมื่อมี PR ยื่นเข้ามาขอเข้า main
  push:
    branches: [ "main" ] # รันซ้ำอีกครั้งเมื่อ Merge เข้า main เรียบร้อยแล้ว

jobs:
  test:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest

    # 1. เพิ่ม PostgreSQL Service Container สำหรับ Integration Test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: KhonNaRak5555
          POSTGRES_DB: hospital_middleware
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      # 2. สร้างตารางใน Postgres ก่อนรันเทส
      - name: Run Database Migrations
        run: |
          PGPASSWORD=KhonNaRak5555 psql -h 127.0.0.1 -U postgres -d hospital_middleware -f migrations/000001_create_hospital_and_staff_tables.up.sql

      - name: Run Unit Tests
        run: go test -v -race -cover ./...

  build-check:
    name: Verify Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Verify Go Build
        run: CGO_ENABLED=0 GOOS=linux go build -v ./...