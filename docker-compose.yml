services:
  # 1. Database Service
  postgres:
    image: postgres:15-alpine
    container_name: hospital_middleware
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: KhonNaRak5555
      POSTGRES_DB: hospital_middleware
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_create_hospital_and_staff_tables.up.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d hospital_middleware" ] # 🟢 แก้จาก pg_ready เป็น pg_isready
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Golang Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_app
    environment:
      SERVER_PORT: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: KhonNaRak5555
      DB_NAME: hospital_middleware
      JWT_SECRET: "super-secret-key-5678"
      HOSPITAL_A_BASE_URL: "https://hospital-a.api.co.th"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hospital_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data: